[project]
name = "openschoolos-api"
version = "0.1.0"
description = "OpenSchoolOS backend (FastAPI)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.2",
    "uvicorn>=0.51.0",
    "pydantic>=2.13.4",
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.5",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
