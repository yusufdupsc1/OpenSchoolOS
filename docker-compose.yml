services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openschoolos
      POSTGRES_PASSWORD: openschoolos
      POSTGRES_DB: openschoolos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openschoolos"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://openschoolos:openschoolos@db:5432/openschoolos
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
